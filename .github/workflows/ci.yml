# Tests Nanolight and builds its app on every push and pull request.
# This fork is Mac-only (clipboard history, Picemon, Codex): no Windows or
# Linux builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build test
      - run: zig build app
      - run: cd raycast && npm ci && npm test
